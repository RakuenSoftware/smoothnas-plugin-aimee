# aimee-kb — the knowledge-base service (DB2 + pgvector).
#
# Serves the /v1 HTTP API and owns the shared, vector-backed memory store. It
# does NOT bundle its datastores: it requires a reachable Postgres (pgvector)
# database AND an embedder service. SmoothNAS plugins are single-container, so
# those two dependencies must run elsewhere (your own infra, another host, or a
# separate plugin) and be reachable from this container — set AIMEE_DB2_URL and
# AIMEE_EMBEDDER_URL below accordingly.
#
# Image: ghcr.io/rakuensoftware/aimee-kb  (Dockerfile upstream)
apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: aimee-kb
  version: 0.1.0
  description: >-
    aimee knowledge base — shared, vector-backed memory over the /v1 HTTP API.
    Requires an external Postgres (pgvector) database and embedder service
    (configure AIMEE_DB2_URL and AIMEE_EMBEDDER_URL).
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
artifact:
  type: oci-image
  image: ghcr.io/rakuensoftware/aimee-kb:latest
container:
  # Image default CMD is ["--http-port=8741"]; AIMEE_KB_HTTP_BIND=1 (baked) binds
  # the listener on 0.0.0.0. No override needed.
  restartPolicy: unless-stopped
volumes:
  # kb state and baked config under AIMEE_HOME. (Postgres data is external.)
  - name: home
    mode: flat
    bind: /var/lib/aimee
ports:
  - name: api
    port: 8741
    protocol: tcp
    expose: false
    hostExpose: true
config:
  # REQUIRED. Connection URL for the pgvector-enabled Postgres that backs DB2.
  # The image default points at the compose hostname `postgres`, which does NOT
  # resolve outside that compose network — override with a reachable address.
  - key: AIMEE_DB2_URL
    type: string
    label: Postgres (pgvector) URL
    default: postgresql://aimee:aimee@postgres:5432/aimee_shared
    description: >-
      REQUIRED. libpq connection URL for the pgvector Postgres backing DB2 (e.g.
      postgresql://aimee:PASS@10.0.0.6:5432/aimee_shared). Must be reachable from
      this container.
  # REQUIRED. Embedder service base URL (backs real semantic embeddings).
  - key: AIMEE_EMBEDDER_URL
    type: string
    label: Embedder URL
    default: http://embedder:8080
    description: >-
      REQUIRED. Base URL of the embedder service (e.g. http://10.0.0.6:8080).
      Must be reachable from this container.
  # Optional OpenAI-compatible LLM endpoint enabling the synthesis / curator
  # passes. Blank leaves them disabled (they fail closed without an endpoint).
  - key: LLM_ENDPOINT
    type: string
    label: LLM endpoint (optional)
    default: ""
    description: >-
      Optional. OpenAI-compatible endpoint (e.g. http://10.0.0.7:8080/v1) to
      enable the candidate-synthesis and curator passes. Blank = disabled.
  - key: LLM_MODEL
    type: string
    label: LLM model (optional)
    default: ""
    description: Optional. Model name to request from the LLM endpoint.
